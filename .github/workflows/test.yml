name: Test Suite

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  license:
    name: License headers
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install HawkEye
        uses: taiki-e/install-action@v2
        with:
          tool: hawkeye@7.2.0

      - name: Check license headers
        run: hawkeye check --fail-on-unknown

  integration-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --lib

      - name: Run integration snapshot test
        run: cargo test --test integration_test
